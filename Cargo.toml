[package]
name = "space-crusaders"
version = "0.1.0"
edition = "2021"
# Bevy 0.19 declares 1.95. The repository's rustup toolchain is newer than that
# and carries the Windows cross-target as well, so this is a floor rather than
# something that has to be installed.
rust-version = "1.95"

[dependencies]
# Keep the feature set focused on this port: every feature here backs a system
# that exists.
#
# `std` and `async_executor` are not optional the way the rest are. Bevy can be
# built for platforms that have neither, so with `default-features = false`
# they have to be asked for by name or nothing links at all.
bevy = { version = "0.19", default-features = false, features = [
    "std", "async_executor",
    "multi_threaded", "bevy_asset", "bevy_scene", "bevy_winit",
    "bevy_core_pipeline", "bevy_pbr", "bevy_gltf", "bevy_render",
    # The nuclonium field is rendered as HDR emissive particles. Bloom is the
    # camera pass that turns values above one into a visible halo rather than
    # clipping them to the eight-bit presentation target.
    "bevy_post_process",
    "bevy_text", "bevy_ui", "png", "x11",
    # `bevy_ui` is layout only: it measures and positions nodes and draws none
    # of them. The pass that puts a UI node on the screen lives in
    # `bevy_ui_render`, which `DefaultPlugins` adds behind this feature -- so
    # without it the HUD, the frame-rate readout, the console and the pause
    # menu are all laid out every frame and never seen.
    "bevy_ui_render",
    # The tonemapping LUTs are KTX2 files compressed with zstd, and the
    # decompressor is no longer chosen for you -- naming neither is a hard
    # compile error rather than a silent fallback. The Rust implementation
    # rather than the C one, so the MinGW cross-build stays a pure Rust build
    # with no second toolchain to install.
    "tonemapping_luts", "zstd_rust",
    # Skeletal animation, and the glTF loader's half of it: the clips this port
    # plays are all authored in the GLBs, so the loader half is what makes the
    # tables it looks names up in exist at all.
    "bevy_animation", "gltf_animation",
    # Keyboard and mouse are each their own backend now rather than part of one
    # input plugin, and an unnamed one is simply never reported.
    "keyboard", "mouse",
    # Every `TextFont` in this port leaves `font` unset, which means the default
    # font source, and that only resolves to a face when this feature embeds
    # one. Without it a text node draws its background and no glyphs -- a
    # console that is a black bar with nothing written on it.
    "default_font",
] }

# The impostor sheets carry a small JSON sidecar describing how the atlas is
# laid out -- how many angles, how many frames, how big a quad it draws onto.
# The baker writes it and the game reads it, so it is a real dependency rather
# than a test one; the clip-name test, which reads a glTF's JSON chunk directly,
# uses the same crate.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Writing the impostor atlases. Bevy already builds this to *read* PNGs, so
# naming it costs no compile time; what it buys is a real deflate encoder. A
# hand-rolled one storing its scanlines uncompressed turned a one-megabyte
# atlas into sixteen, which is a runtime asset and a committed file.
image = { version = "0.25", default-features = false, features = ["png"] }

# Windows is where the game is played, and there both device backends build
# against the OS with no extra packages, so both are always on.
[target.'cfg(windows)'.dependencies]
bevy = { version = "0.19", default-features = false, features = [
    "bevy_audio", "wav", "bevy_gilrs", "gamepad",
] }

[features]
default = []
# Sound and gamepad backends on Linux compile against ALSA and udev
# development headers (`libasound2-dev`, `libudev-dev`). The repository's WSL
# environment has neither and cannot install them, and requiring them would
# make `cargo test` unbuildable there, so a Linux host opts in instead:
#
#   cargo run --features sound,gamepad
#
# Nothing else is conditional. The sound *tables* and the input snapshot are
# always compiled and tested; only the device backends come and go. Without
# `gamepad` no pad is ever reported and every pad field reads neutral.
#
# Each of these now needs two Bevy features rather than one: the device backend
# and the input source that reports it. `bevy_gilrs` without `gamepad` is a
# driver whose events nothing collects, and `bevy_audio` is no longer implied
# by having 3D or UI switched on.
sound = ["bevy/bevy_audio", "bevy/wav"]
gamepad = ["bevy/bevy_gilrs", "bevy/gamepad"]

# Per-system timing, for working out which half of a frame the crowd is in.
#
#   cargo run --features perf
#
# writes a `trace-*.json` beside the executable; open it in `chrome://tracing`
# or at https://ui.perfetto.dev and every system in the schedule is a span.
# Bevy's own instrumentation rather than timers added by hand: the systems that
# matter here are Bevy's -- `animate_targets`, `propagate_parent_transforms`,
# the render-phase queues -- and those cannot be timed from this crate at all.
perf = ["bevy/trace", "bevy/trace_chrome"]

# Where in a frame the time went, without a tracing viewer.
#
#   cargo run --features spike
#
# Bevy's own schedules are timed by bracketing `Main` with probe schedules, so
# each frame is attributed across `First`, `PreUpdate`, `FixedMain`, `Update`,
# `SpawnScene`, `PostUpdate` and `Last`. Any frame over the threshold writes a
# line to a `spikes.txt` beside the executable -- a file rather than stderr
# because the Windows build is a `windows_subsystem = "windows"` binary and has
# no console to print to. Each line records the display settings it was taken
# under, so one log can hold a whole sweep of configurations.
#
# Off by default: the probe schedules cost a little every frame, and this is an
# instrument rather than a feature of the game. `perf` is the finer tool and
# the two are independent -- reach for this one first, because it answers
# "which phase" in a text file, and for `perf` when the answer is "which
# system" and a span viewer is worth opening.
spike = []

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
